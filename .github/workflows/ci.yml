name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Packed tarball ships the capability catalog
        run: pnpm run check:pack
      - name: Optional dependency ranges resolve to published packs with code
        run: pnpm run check:ranges
