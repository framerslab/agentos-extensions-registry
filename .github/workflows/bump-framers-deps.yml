name: Bump @framers/* deps

# Weekly cron + manual trigger. Bumps every @framers/* explicit version pin
# in package.json files to the latest npm-published version, refreshes the
# pnpm lockfile when present, bumps git submodule pointers when present,
# and opens a single Pull Request with the diff. The same workflow drops
# into every repo that depends on the agentos family.
#
# The branch is pushed and the pull request opened with FRAMERS_BUMP_TOKEN, a personal
# access token held as a framerslab organization secret, never with GITHUB_TOKEN. A pull
# request that a workflow opens or pushes with GITHUB_TOKEN gets its pull_request runs in an
# approval-required state, with no job until someone with write access approves them; one
# opened with a personal access token or a GitHub App token runs its workflows as any pull
# request does. GitHub, "Triggering a workflow from a workflow":
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow#triggering-a-workflow-from-a-workflow
# Pull request 28 (19 October 2026) was opened with GITHUB_TOKEN: its CI and Links runs
# (39208141935, 39208141941) stopped at action_required with no job. The bumps before it got
# CI only after a maintainer approved their held runs or closed and reopened the pull request.

on:
  schedule:
    - cron: '0 6 * * 1'  # Monday 06:00 UTC weekly
  workflow_dispatch: {}

# The push and the pull request go through FRAMERS_BUMP_TOKEN, so the job's own GITHUB_TOKEN
# only reads.
permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    # FRAMERS_BUMP_TOKEN is a personal access token that reaches past this repository, and a
    # step can change what a later step of its job runs, so no install script runs in this job
    # and its third-party actions are pinned to a commit, with the release that commit carries
    # named beside it.
    steps:
      # First: without the secret, create-pull-request stops with "Input 'token' not
      # supplied", but only at the last step, after the bump has been computed.
      - name: FRAMERS_BUMP_TOKEN is available
        env:
          FRAMERS_BUMP_TOKEN: ${{ secrets.FRAMERS_BUMP_TOKEN }}
        run: |
          if [ -z "$FRAMERS_BUMP_TOKEN" ]; then
            echo "::error::FRAMERS_BUMP_TOKEN is not available here; a pull request opened with GITHUB_TOKEN gets no CI job."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          # master, whichever branch a manual run names: the pull request goes into master,
          # and pins bumped from another branch's package.json are not master's.
          ref: master
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Update submodules to latest (when present)
        run: |
          if [ -f .gitmodules ]; then
            git submodule update --remote --recursive
          fi

      - name: Bump @framers/* deps to latest published versions
        run: python3 .github/scripts/bump-framers-deps.py

      # A lockfile refresh needs no install script, and none runs in a job that holds
      # FRAMERS_BUMP_TOKEN. This repository commits no lockfile, so here the step does nothing.
      - name: Refresh pnpm lockfile (when present)
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --no-frozen-lockfile --ignore-scripts
          fi

      # This repository's own step: the capability catalog is built from the extension
      # manifests in agentos-extensions, and a checkout with none beside it keeps the committed
      # file, so the catalog went stale whenever a pack was added or described anew. The
      # generator reads ../agentos-extensions/registry/curated; only the manifests are fetched.
      - name: Regenerate the capability catalog from agentos-extensions' manifests
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/framerslab/agentos-extensions.git ../agentos-extensions
          git -C ../agentos-extensions sparse-checkout set --no-cone '/registry/curated/**/manifest.json'
          node scripts/generate-capability-catalog.mjs

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          # the personal access token, so the pull request's own events start CI and Links (see
          # the file's top); branch-token defaults to it, so the branch push goes through it too
          token: ${{ secrets.FRAMERS_BUMP_TOKEN }}
          # fix(deps), not chore(deps): the release skips chore commits, so a chore bump
          # never reached npm and consumers kept the old dependency ranges.
          commit-message: 'fix(deps): bump @framers/* deps to latest published versions'
          title: 'fix(deps): bump @framers/* deps to latest published versions'
          body: |
            Automated weekly bump of all `@framers/*` dependencies to their
            latest npm-published versions.

            Includes (when applicable):
            - `package.json` explicit-pin updates (caret semver of latest)
            - `pnpm-lock.yaml` refresh
            - Git submodule pointer updates (where the parent repo has submodules)
            - `src/capability-catalog.json` regenerated from agentos-extensions' manifests

            Workspace `workspace:*` pins are not touched. Review the diff
            for any unexpected major-version jumps before merging.
          branch: chore/bump-framers-deps
          base: master
          delete-branch: true
          # No add-paths: a pathspec naming a file a repo doesn't commit
          # (pnpm-lock.yaml, .gitmodules) makes the action's `git add` fatal,
          # staging NOTHING - and `**/package.json` misses the root manifest.
          # Default collection stages every bump change.
